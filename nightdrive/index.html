<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05061a">
<title>NightDrive.exe | Yo Agami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Mr+Dafoe&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05061a;color:#fff;overflow:hidden;font-family:"VT323",monospace;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;font-size:26px;pointer-events:none;text-shadow:0 0 10px #ff4fd8}
.back{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:8px 14px;border-radius:999px;border:1px solid rgba(255,79,216,.6);background:rgba(5,6,26,.75);color:#fff;text-decoration:none;font-size:20px;z-index:5}
.mute{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:8px 14px;border-radius:999px;border:1px solid rgba(74,163,255,.6);background:rgba(5,6,26,.75);color:#fff;font:20px "VT323",monospace;z-index:5;cursor:pointer}
.panel{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:rgba(5,6,26,.55);z-index:4}
.panel h1{margin:0;font-family:"Mr Dafoe",cursive;font-weight:400;font-size:clamp(64px,14vw,130px);line-height:1;text-shadow:0 0 18px #ff4fd8,3px 4px 0 #6a1a9a}
.panel p{font-size:24px;margin:8px 0;color:#ffd6f6}
.panel .big{font-size:56px;color:#fff;text-shadow:0 0 14px #4aa3ff}
.panel button{margin:14px 6px 0;min-height:50px;padding:0 26px;border-radius:999px;border:0;background:linear-gradient(180deg,#ff7ae3,#c21fa0);color:#fff;font:26px "VT323",monospace;cursor:pointer;box-shadow:0 0 22px rgba(255,79,216,.5)}
.panel button.alt{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);box-shadow:none}
.panel small{display:block;font-size:20px;color:#a99cc8;margin-top:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span id="sc">0</span><span id="sp">0 KM/H</span></div>
<a class="back" href="../">&larr; YO-OS</a>
<button class="mute" type="button" id="mute">SOUND ON</button>
<div class="panel" id="start"><div><h1>Night Drive</h1><p>Dodge the traffic. Grab the cassettes.</p><button type="button" id="go">START ENGINE</button><small>Arrows / A D on keyboard · tap left or right on phone</small><p id="best0"></p></div></div>
<div class="panel" id="over" hidden><div><p>CRASHED</p><div class="big" id="final">0</div><p id="best"></p><button type="button" id="again">DRIVE AGAIN</button><button type="button" class="alt" id="share">SHARE</button></div></div>
<script>
(function(){
  'use strict';
  var c = document.getElementById('c'), g = c.getContext('2d'), W, H, dpr, hz, cx;
  function ls(k, v){ try{ if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
  function size(){ dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); hz = H * .42; cx = W / 2; }
  size(); addEventListener('resize', size);
  var AC = null, muted = ls('nd-mute') === '1', engine = null;
  function ac(){ if (!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
  function tone(f, d, type, v){ if (muted) return; var a = ac(); if (!a) return; var t = a.currentTime, o = a.createOscillator(), gg = a.createGain(); o.type = type || 'square'; o.frequency.value = f; gg.gain.setValueAtTime(v || .05, t); gg.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(gg); gg.connect(a.destination); o.start(t); o.stop(t + d + .02); }
  function startEngine(){ var a = ac(); if (!a || engine) return; var o = a.createOscillator(), f = a.createBiquadFilter(), gg = a.createGain(); o.type = 'sawtooth'; o.frequency.value = 50; f.type = 'lowpass'; f.frequency.value = 260; gg.gain.value = muted ? 0 : .035; o.connect(f); f.connect(gg); gg.connect(a.destination); o.start(); engine = {o: o, g: gg}; }
  function stopEngine(){ if (engine){ try{ engine.o.stop(); }catch(e){} engine = null; } }
  document.getElementById('mute').textContent = muted ? 'SOUND OFF' : 'SOUND ON';
  document.getElementById('mute').addEventListener('click', function(){ muted = !muted; ls('nd-mute', muted ? '1' : '0'); this.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; if (engine) engine.g.gain.value = muted ? 0 : .035; });

  /* projection: world z (0 = player, bigger = farther), lane x in -1..1 */
  function Y(z){ return hz + (H - hz) * .92 / (z + 1); }
  function S(z){ return 1 / (z + 1); }
  function X(lx, z){ return cx + lx * Math.min(W * .3, 260) * S(z); }

  var state = 'menu', lane = 0, px = 0, speed = 0, dist = 0, score = 0, tapes = 0, objs = [], spawnT = 0, t0 = 0, best = +(ls('nd-best') || 0), flash = 0, stars = [];
  for (var i = 0; i < 120; i++) stars.push([Math.random(), Math.random() * .9, Math.random()]);
  document.getElementById('best0').textContent = best ? 'BEST: ' + best : '';

  function reset(){ lane = 0; px = 0; speed = 8; dist = 0; score = 0; tapes = 0; objs = []; spawnT = 0; flash = 0; }
  function spawn(){
    var free = [-1, 0, 1].sort(function(){ return Math.random() - .5; }), n = Math.random() < Math.min(.15 + dist / 6000, .55) ? 2 : 1;
    for (var i = 0; i < n; i++) objs.push({lx: free[i], z: 22, k: 'car', col: ['#4aa3ff','#ffb347','#7cf3ff','#b9dcff'][Math.random() * 4 | 0]});
    if (Math.random() < .55) objs.push({lx: free[2], z: 22 + Math.random() * 3, k: 'tape'});
  }
  function move(d){ if (state !== 'play') return; lane = Math.max(-1, Math.min(1, lane + d)); tone(500 + lane * 80, .04); }
  addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ move(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ move(1); e.preventDefault(); }
    else if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') begin();
  });
  c.addEventListener('pointerdown', function(e){ if (state === 'play') move(e.clientX < W / 2 ? -1 : 1); });

  function begin(){ reset(); state = 'play'; document.getElementById('start').hidden = true; document.getElementById('over').hidden = true; startEngine(); tone(220, .2, 'sawtooth', .06); }
  function crash(){
    state = 'over'; flash = 1; stopEngine(); tone(80, .6, 'sawtooth', .1); if (navigator.vibrate) navigator.vibrate(120);
    score = Math.floor(dist) + tapes * 50; if (score > best){ best = score; ls('nd-best', best); }
    setTimeout(function(){ document.getElementById('final').textContent = score; document.getElementById('best').textContent = 'BEST: ' + best + ' · CASSETTES: ' + tapes; document.getElementById('over').hidden = false; }, 500);
  }
  document.getElementById('go').addEventListener('click', begin);
  document.getElementById('again').addEventListener('click', begin);
  document.getElementById('share').addEventListener('click', function(){
    var t = 'I drove ' + score + ' on NightDrive.exe. Beat that.', u = 'https://agmteam.com/nightdrive/';
    if (navigator.share) navigator.share({title: 'NightDrive', text: t, url: u}).catch(function(){}); else { try{ navigator.clipboard.writeText(t + ' ' + u); this.textContent = 'COPIED'; }catch(e){} }
  });

  function drawCar(x, y, s, col, me){
    var w = 150 * s, h = 70 * s;
    g.save(); g.translate(x, y);
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(-w / 2, -h * .1, w, h * .2);
    g.fillStyle = me ? '#ff4fd8' : col; g.shadowColor = me ? '#ff4fd8' : col; g.shadowBlur = 16 * s;
    g.beginPath(); g.moveTo(-w / 2, 0); g.lineTo(-w / 2, -h * .55); g.lineTo(-w * .32, -h); g.lineTo(w * .32, -h); g.lineTo(w / 2, -h * .55); g.lineTo(w / 2, 0); g.closePath(); g.fill();
    g.shadowBlur = 0; g.fillStyle = '#05061a'; g.fillRect(-w * .28, -h * .92, w * .56, h * .3);
    g.fillStyle = me ? '#fff' : '#ff2f4f'; g.fillRect(-w * .46, -h * .45, w * .2, h * .12); g.fillRect(w * .26, -h * .45, w * .2, h * .12);
    g.fillStyle = '#111'; g.fillRect(-w * .48, -h * .08, w * .18, h * .14); g.fillRect(w * .3, -h * .08, w * .18, h * .14);
    g.restore();
  }
  function drawTape(x, y, s, t){
    var w = 90 * s, h = 56 * s; g.save(); g.translate(x, y - h * .8 - Math.sin(t / 200) * 6 * s); g.rotate(Math.sin(t / 300) * .2);
    g.fillStyle = '#0b1433'; g.strokeStyle = '#7cf3ff'; g.lineWidth = 3 * s; g.shadowColor = '#7cf3ff'; g.shadowBlur = 18 * s;
    g.fillRect(-w / 2, -h / 2, w, h); g.strokeRect(-w / 2, -h / 2, w, h); g.shadowBlur = 0;
    g.fillStyle = '#ff4fd8'; g.fillRect(-w * .38, -h * .38, w * .76, h * .26);
    g.fillStyle = '#eaf4ff'; g.beginPath(); g.arc(-w * .2, h * .15, h * .14, 0, 7); g.arc(w * .2, h * .15, h * .14, 0, 7); g.fill();
    g.restore();
  }
  function scene(t){
    var sky = g.createLinearGradient(0, 0, 0, hz); sky.addColorStop(0, '#05061a'); sky.addColorStop(.75, '#2a0d4a'); sky.addColorStop(1, '#8a1e6a');
    g.fillStyle = sky; g.fillRect(0, 0, W, hz);
    stars.forEach(function(s){ g.fillStyle = 'rgba(255,255,255,' + (.3 + .5 * Math.sin(t / 600 + s[2] * 9)) + ')'; g.fillRect(s[0] * W, s[1] * hz, 2, 2); });
    var r = Math.min(W, H) * .17, sy = hz - r * .25, sg = g.createLinearGradient(0, sy - r, 0, sy + r);
    sg.addColorStop(0, '#ffd36b'); sg.addColorStop(.5, '#ff7a59'); sg.addColorStop(1, '#ff2fa8');
    g.save(); g.beginPath(); g.rect(0, 0, W, hz); g.clip(); g.beginPath(); g.arc(cx, sy, r, 0, 7); g.fillStyle = sg; g.shadowColor = '#ff4fd8'; g.shadowBlur = 40; g.fill(); g.shadowBlur = 0;
    g.fillStyle = '#2a0d4a'; for (var i = 0; i < 6; i++) g.fillRect(cx - r, sy + i * r * .17, r * 2, 2 + i * 1.5); g.restore();
    g.fillStyle = '#12052a'; g.beginPath(); g.moveTo(0, hz);
    for (var x = 0; x <= W; x += 30) g.lineTo(x, hz - 18 - Math.abs(Math.sin(x * .013) * 46 + Math.sin(x * .031) * 22));
    g.lineTo(W, hz); g.fill();
    g.fillStyle = '#05061a'; g.fillRect(0, hz, W, H - hz);
    g.strokeStyle = 'rgba(255,79,216,.35)'; g.lineWidth = 1;
    for (var j = -14; j <= 14; j++){ g.beginPath(); g.moveTo(X(j * .5, 40), hz); g.lineTo(X(j * .5, -.6), H); g.stroke(); }
    var off = dist % 2;
    for (var z = 22 - off; z > -1; z -= 2){ var y = Y(z); g.globalAlpha = Math.min(1, 1.4 - z / 22); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(10,14,40,.85)'; g.beginPath(); g.moveTo(X(-1.6, 40), hz); g.lineTo(X(1.6, 40), hz); g.lineTo(X(1.6, -.6), H); g.lineTo(X(-1.6, -.6), H); g.fill();
    g.strokeStyle = '#4aa3ff'; g.lineWidth = 3; g.shadowColor = '#4aa3ff'; g.shadowBlur = 12;
    [-1.6, 1.6].forEach(function(e){ g.beginPath(); g.moveTo(X(e, 40), hz); g.lineTo(X(e, -.6), H); g.stroke(); }); g.shadowBlur = 0;
    g.fillStyle = 'rgba(234,244,255,.8)';
    for (var z2 = 22 - (dist * 1.5 % 3); z2 > -1; z2 -= 3){ [-.5, .5].forEach(function(lx){ var y1 = Y(z2), y2 = Y(z2 + 1), w1 = 4 * S(z2) * 3; g.beginPath(); g.moveTo(X(lx, z2) - w1, y1); g.lineTo(X(lx, z2) + w1, y1); g.lineTo(X(lx, z2 + 1) + w1 * .6, y2); g.lineTo(X(lx, z2 + 1) - w1 * .6, y2); g.fill(); }); }
  }
  var last = 0;
  function frame(t){
    requestAnimationFrame(frame);
    var dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    if (state === 'play'){
      speed = Math.min(26, speed + dt * .35); dist += speed * dt * 1.2;
      px += (lane - px) * Math.min(1, dt * 14);
      spawnT -= dt; if (spawnT <= 0){ spawn(); spawnT = Math.max(.55, 1.6 - dist / 2500); }
      objs.forEach(function(o){ o.z -= speed * dt * .9; });
      objs = objs.filter(function(o){
        if (o.z < .45 && o.z > -.2 && Math.abs(o.lx - px) < .5){
          if (o.k === 'tape'){ tapes++; tone(1047, .12, 'triangle', .07); tone(1568, .18, 'triangle', .05); return false; }
          crash(); return true;
        }
        return o.z > -1.2;
      });
      score = Math.floor(dist) + tapes * 50;
      if (engine && AC) engine.o.frequency.setTargetAtTime(40 + speed * 4, AC.currentTime, .1);
      document.getElementById('sc').textContent = score + (tapes ? '  ·  ' + tapes + ' TAPES' : '');
      document.getElementById('sp').textContent = Math.round(speed * 9) + ' KM/H';
    } else if (state === 'menu'){ dist += dt * 6; }
    scene(t);
    objs.slice().sort(function(a, b){ return b.z - a.z; }).forEach(function(o){ if (o.z < -1) return; var s = S(o.z); if (o.k === 'car') drawCar(X(o.lx, o.z), Y(o.z), s, o.col); else drawTape(X(o.lx, o.z), Y(o.z), s, t); });
    if (state !== 'menu') drawCar(X(px, 0), Y(0) - 6, S(0) * 1.05, null, true);
    if (flash > 0){ g.fillStyle = 'rgba(255,255,255,' + flash + ')'; g.fillRect(0, 0, W, H); flash = Math.max(0, flash - dt * 2.5); }
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', function(){ if (document.hidden && engine) stopEngine(); else if (!document.hidden && state === 'play') startEngine(); });
})();
</script>
</body>
</html>
